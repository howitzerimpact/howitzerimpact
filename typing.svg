<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="transparent"/>

  <defs>
    <clipPath id="typing">
      <rect x="0" y="0" width="0" height="180">
        <animate
          attributeName="width"
          values="0;40;80;120;160;210;260;310;360;410;470;530;600;670;750;840;940;1050;1200;1200;0"
          dur="7s"
          calcMode="discrete"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="monospace"
    font-size="52"
    fill="#642218"
    clip-path="url(#typing)">
    " 𝙸'𝚖 𝚜𝚘𝚛𝚛𝚢 𝚏𝚘𝚛 𝚎𝚟𝚎𝚛𝚢𝚝𝚑𝚒𝚗𝚐 . "
  </text>

</svg>
