<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="transparent"/>

  <defs>
    <clipPath id="typing">
      <rect x="0" y="0" width="0" height="180">
        <animate
          attributeName="width"
          values="0;1200;1200;0"
          keyTimes="0;0.55;0.92;1"
          dur="10s"
          calcMode="linear"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="monospace"
    font-size="52"
    fill="#95381A"
    clip-path="url(#typing)">
    " I'm sorry for everything . "
  </text>

</svg>
