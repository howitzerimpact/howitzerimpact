<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="transparent"/>

  <defs>
    <clipPath id="typing">
      <rect x="0" y="0" width="0" height="180">
        <animate
          attributeName="width"
          values="0;45;90;135;180;225;270;315;360;405;450;500;550;600;650;700;750;800;850;900;950;1000;1050;1100;1200;1200;0"
          dur="8s"
          calcMode="discrete"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="monospace"
    font-size="52"
    clip-path="url(#typing)">

    <tspan fill="#95381A">
      So... 
    </tspan>

    <tspan fill="#00FFAB">
      Izuku
    </tspan>

    <tspan fill="#95381A">
      , can 
    </tspan>

    <tspan fill="#f95813">
      I
    </tspan>

    <tspan fill="#95381A">
      still catch up to 
    </tspan>

    <tspan fill="#00FFAB">
      you
    </tspan>

    <tspan fill="#95381A">
      ?
    </tspan>

  </text>

</svg>
